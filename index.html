<script>
const U = "https://google.com";
let D = JSON.parse(localStorage.getItem('maidan_data')) || { pin: "2026", vehicles: [], accounts: [], clients: [] };
document.getElementById('ad').valueAsDate = new Date();
document.getElementById('pin').addEventListener('keyup', function(e) { if (e.key === 'Enter') go(); });

function go() {
  let v = document.getElementById('pin').value.trim();
  if (v === String(D.pin) || v === "2026") {
    document.getElementById('lock').style.display = 'none';
    sync();
  } else {
    document.getElementById('err').style.display = 'block';
  }
}

function out() {
  document.getElementById('pin').value = '';
  document.getElementById('lock').style.display = 'flex';
}

function pg(x) {
  document.querySelectorAll('.pg').forEach(e => e.classList.remove('act'));
  document.getElementById('pg-' + x).classList.add('act');
  document.querySelectorAll('.ni').forEach(e => e.classList.remove('act'));
  if (document.getElementById('n-' + x)) document.getElementById('n-' + x).classList.add('act');
  window.scrollTo(0, 0);
}

function qacc(t) {
  document.getElementById('at').value = t;
  pg('acc');
}

async function save() {
  localStorage.setItem('maidan_data', JSON.stringify(D));
  ren();
  document.getElementById('st').textContent = "⏳ جاري الحفظ...";
  try {
    await fetch(U, { method: 'POST', mode: 'no-cors', body: JSON.stringify(D) });
    document.getElementById('st').textContent = "✓ محفوظ في Google";
  } catch (e) {}
}

async function sync() {
  try {
    let r = await fetch(U);
    let j = await r.json();
    if (j && (j.vehicles || j.accounts || j.clients)) {
      D = { pin: j.pin || "2026", vehicles: j.vehicles || [], accounts: j.accounts || [], clients: j.clients || [] };
      localStorage.setItem('maidan_data', JSON.stringify(D));
    }
  } catch (e) {}
  ren();
}

function addV() {
  let p = document.getElementById('vp').value.trim();
  if (!p) return alert("أدخل رقم اللوحة");
  D.vehicles.unshift({
    id: Date.now(),
    plate: p,
    model: document.getElementById('vm').value,
    driver: document.getElementById('vd').value,
    expiry: document.getElementById('vx').value
  });
  document.getElementById('vp').value = '';
  document.getElementById('vm').value = '';
  document.getElementById('vd').value = '';
  save();
}

function addA() {
  let a = parseFloat(document.getElementById('aa').value);
  let t = document.getElementById('al').value.trim();
  if (!a || !t) return alert("أدخل المبلغ والبيان");
  D.accounts.unshift({
    id: Date.now(),
    type: document.getElementById('at').value,
    cat: document.getElementById('ac').value,
    amount: a,
    title: t,
    date: document.getElementById('ad').value
  });
  document.getElementById('aa').value = '';
  document.getElementById('al').value = '';
  save();
}

function addC() {
  let n = document.getElementById('cn').value.trim();
  if (!n) return alert("أدخل اسم العميل");
  D.clients.unshift({
    id: Date.now(),
    name: n,
    phone: document.getElementById('cp').value,
    plan: document.getElementById('cl').value,
    fee: parseFloat(document.getElementById('cf').value) || 0,
    paid: false
  });
  document.getElementById('cn').value = '';
  document.getElementById('cp').value = '';
  document.getElementById('cl').value = '';
  document.getElementById('cf').value = '';
  save();
}

function payC(id) {
  let c = D.clients.find(x => x.id === id);
  if (c) { c.paid = !c.paid; save(); }
}

function del(k, i) {
  if (confirm("تأكيد الحذف؟")) {
    D[k] = D[k].filter(x => x.id !== i);
    save();
  }
}

function cpin() {
  let p = document.getElementById('np').value.trim();
  if (p.length >= 4) {
    D.pin = p;
    document.getElementById('np').value = '';
    save();
    alert("تم حفظ الرمز الجديد");
  }
}

function cvat() {
  let v = parseFloat(document.getElementById('vi').value) || 0;
  document.getElementById('vr').textContent = "الإجمالي: " + (v * 1.15).toFixed(2) + " ر.س";
}

function bkp() {
  let a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(D, null, 2)], { type: 'application/json' }));
  a.download = 'maidan_backup.json';
  a.click();
}
function ren() {
  let i = 0, e = 0, al = [], now = new Date();
  D.accounts.forEach(a => a.type === 'إيراد' ? i += Number(a.amount) : e += Number(a.amount));
  document.getElementById('ki').textContent = i.toLocaleString() + " ر.س";
  document.getElementById('ke').textContent = e.toLocaleString() + " ر.س";
  document.getElementById('kn').textContent = (i - e).toLocaleString() + " ر.س";

  document.getElementById('lv').innerHTML = D.vehicles.map(v => {
    let b = '<span class="pl pg-a">بدون تاريخ</span>';
    if (v.expiry) {
      let df = Math.ceil((new Date(v.expiry) - now) / 864e5);
      if (df <= 30) {
        b = `<span class="pl pg-r">${df < 0 ? 'منتهي منذ ' + Math.abs(df) + ' يوم' : 'متبقي ' + df + ' يوم'}</span>`;
        al.push(`<div class="it"><div><b>⚠️ مركبة ${v.plate}</b><br><small>السائق: ${v.driver || '-'}</small></div>${b}</div>`);
      } else {
        b = `<span class="pl pg-g">سارية (${df} يوم)</span>`;
      }
    }
    return `<div class="it"><div><b>${v.plate}</b> • ${v.model || ''}<br><small>السائق: ${v.driver || '-'}</small><div style="margin-top:4px">${b}</div></div><button class="dl" onclick="del('vehicles',${v.id})">حذف</button></div>`;
  }).join('');

  document.getElementById('la').innerHTML = D.accounts.map(a =>
    `<div class="it"><div><b>${a.title}</b> <span class="pl pg-a">${a.cat || ''}</span><br><small>${a.date || ''}</small></div><div><span class="pl ${a.type === 'إيراد' ? 'pg-g' : 'pg-r'}">${a.type === 'إيراد' ? '+' : '-'}${Number(a.amount).toLocaleString()} ر.س</span> <button class="dl" onclick="del('accounts',${a.id})">حذف</button></div></div>`
  ).join('');

  document.getElementById('lc').innerHTML = D.clients.map(c => {
    if (!c.paid) al.push(`<div class="it"><div><b>💳 فاتورة غير مسددة: ${c.name}</b><br><small>${c.plan || ''}</small></div><span class="pl pg-r">${c.fee} ر.س</span></div>`);
    return `<div class="it"><div><b>${c.name}</b> • <small>${c.phone || ''}</small><br><small>${c.plan || ''} (${c.fee} ر.س)</small><div style="margin-top:4px"><span class="pl ${c.paid ? 'pg-g' : 'pg-r'}">${c.paid ? 'مسدد ✓' : 'غير مسدد'}</span></div></div><div style="display:flex;gap:5px"><button class="ok" onclick="payC(${c.id})">${c.paid ? 'إلغاء' : 'سداد'}</button><button class="dl" onclick="del('clients',${c.id})">حذف</button></div></div>`;
  }).join('');

  document.getElementById('dot').style.display = al.length ? 'block' : 'none';
  document.getElementById('lal').innerHTML = al.join('') || '<div class="cd" style="text-align:center;color:var(--m)">✅ جميع الوثائق والفواتير منتظمة</div>';
}
ren();
