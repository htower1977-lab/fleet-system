<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ميدان العز للنقليات • مساحة الإدارة</title>
<link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link href="https://googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #1F3629;
    --primary-light: #2D4D3B;
    --accent: #C5A059;
    --accent-soft: rgba(197, 160, 89, 0.14);
    --bg: #F6F4EF;
    --card: #FFFFFF;
    --text-main: #1A241E;
    --text-muted: #6B7870;
    --border: rgba(31, 54, 41, 0.08);
    --danger: #D94343;
    --success: #248A52;
    --shadow-soft: 0 10px 30px -5px rgba(31, 54, 41, 0.06), 0 4px 12px -2px rgba(31, 54, 41, 0.03);
    --shadow-float: 0 20px 40px -10px rgba(20, 36, 27, 0.35);
    --radius-lg: 24px;
    --radius-md: 18px;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'IBM Plex Sans Arabic', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background-color: var(--bg);
    color: var(--text-main);
    min-height: 100vh;
    padding-bottom: 110px;
    overflow-x: hidden;
  }

  #lockScreen {
    position: fixed;
    inset: 0;
    background: linear-gradient(160deg, #16281E 0%, #243E30 100%);
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    color: #fff;
  }

  .lock-card {
    background: rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(197, 160, 89, 0.28);
    border-radius: 30px;
    padding: 36px 28px;
    width: 100%;
    max-width: 380px;
    text-align: center;
    box-shadow: 0 25px 50px rgba(0,0,0,0.3);
  }

  .lock-logo {
    width: 72px;
    height: 72px;
    margin: 0 auto 18px;
    background: var(--accent-soft);
    border: 1.5px solid var(--accent);
    border-radius: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent);
  }

  .lock-input {
    width: 100%;
    padding: 15px;
    margin: 20px 0 14px;
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.18);
    background: rgba(0,0,0,0.22);
    color: #fff;
    font-size: 20px;
    text-align: center;
    letter-spacing: 6px;
    outline: none;
  }

  .lock-btn {
    width: 100%;
    padding: 15px;
    border-radius: 16px;
    border: none;
    background: linear-gradient(135deg, #D4AF66 0%, #B38D44 100%);
    color: #16281E;
    font-weight: 700;
    font-size: 16px;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(197, 160, 89, 0.3);
  }

  .top-header {
    background: linear-gradient(145deg, var(--primary) 0%, #16281E 100%);
    color: #fff;
    padding: 20px 20px 26px;
    border-bottom-left-radius: 30px;
    border-bottom-right-radius: 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 12px 30px rgba(31, 54, 41, 0.16);
  }

  .brand-title h1 {
    font-size: 21px;
    font-weight: 700;
    color: #E8CFA0;
    letter-spacing: -0.3px;
  }

  .brand-title p {
    font-size: 12.5px;
    color: rgba(255,255,255,0.75);
    margin-top: 2px;
  }

  .header-actions {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .icon-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(232, 207, 160, 0.35);
    color: #E8CFA0;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    position: relative;
    transition: 0.2s;
  }

  .icon-btn:active { transform: scale(0.93); }

  .badge-dot {
    position: absolute;
    top: 9px;
    right: 10px;
    width: 8px;
    height: 8px;
    background: #FF5A5A;
    border-radius: 50%;
    display: none;
  }

  .sync-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    background: rgba(255,255,255,0.1);
    padding: 4px 10px;
    border-radius: 20px;
    margin-top: 6px;
    color: #A8E6CF;
  }

  .container {
    max-width: 680px;
    margin: 0 auto;
    padding: 20px 18px;
  }

  .hero-slogan {
    text-align: center;
    font-size: 22px;
    font-weight: 700;
    color: var(--primary);
    margin: 4px 0 18px;
  }

  .hero-card {
    background: var(--card);
    border-radius: var(--radius-lg);
    padding: 20px;
    box-shadow: var(--shadow-soft);
    border: 1px solid var(--border);
    margin-bottom: 24px;
  }

  .hero-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    margin-bottom: 18px;
  }

  .hero-text h2 {
    font-size: 19px;
    font-weight: 700;
    color: var(--primary);
    line-height: 1.35;
  }

  .hero-text p {
    font-size: 13.5px;
    color: var(--text-muted);
    margin-top: 6px;
    line-height: 1.5;
  }

  .van-box {
    width: 132px;
    height: 92px;
    border-radius: 18px;
    background: linear-gradient(135deg, #FBF3E4 0%, #F2E3C6 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    border: 1px solid rgba(197, 160, 89, 0.25);
  }

  .quick-btns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .btn-primary {
    background: var(--primary);
    color: #fff;
    border: none;
    padding: 13px;
    border-radius: 15px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(31, 54, 41, 0.18);
    transition: 0.2s;
  }

  .btn-outline {
    background: #fff;
    color: var(--primary);
    border: 1.5px solid rgba(31, 54, 41, 0.22);
    padding: 13px;
    border-radius: 15px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
  }

  .btn-primary:active, .btn-outline:active { transform: scale(0.97); }

  .stats-strip {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 22px;
  }

  .stat-mini {
    background: var(--card);
    padding: 14px 10px;
    border-radius: var(--radius-md);
    text-align: center;
    box-shadow: var(--shadow-soft);
    border: 1px solid var(--border);
  }

  .stat-mini span {
    display: block;
    font-size: 11.5px;
    color: var(--text-muted);
    margin-bottom: 4px;
  }

  .stat-mini strong {
    font-size: 15px;
    font-weight: 700;
  }

  .section-label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 17px;
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 14px;
  }

  .section-label::before {
    content: '';
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
  }

  .dest-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  .dest-card {
    background: var(--card);
    border-radius: var(--radius-lg);
    padding: 24px 16px;
    text-align: center;
    box-shadow: var(--shadow-soft);
    border: 1px solid var(--border);
    cursor: pointer;
    transition: all 0.22s ease;
  }

  .dest-card:active {
    transform: scale(0.96);
    border-color: var(--accent);
  }

  .dest-icon {
    width: 54px;
    height: 54px;
    border-radius: 50%;
    background: var(--primary);
    color: #E8CFA0;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 12px;
    box-shadow: 0 8px 18px rgba(31, 54, 41, 0.16);
  }

  .dest-card h3 {
    font-size: 16.5px;
    font-weight: 700;
    color: var(--text-main);
  }

  .dest-card p {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 3px;
  }

  .bottom-nav-wrap {
    position: fixed;
    bottom: 16px;
    left: 16px;
    right: 16px;
    z-index: 900;
    display: flex;
    justify-content: center;
  }

  .bottom-nav {
    background: rgba(29, 48, 37, 0.94);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(232, 207, 160, 0.2);
    border-radius: 26px;
    padding: 10px 14px;
    width: 100%;
    max-width: 520px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    box-shadow: var(--shadow-float);
  }

  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    color: rgba(255,255,255,0.65);
    font-size: 11.5px;
    font-weight: 500;
    cursor: pointer;
    padding: 6px 4px;
    border-radius: 16px;
    transition: 0.2s;
  }

  .nav-item.active {
    color: #E8CFA0;
    background: rgba(255,255,255,0.08);
    font-weight: 700;
  }

  .page { display: none; animation: fadeIn 0.25s ease; }
  .page.active { display: block; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .form-card {
    background: var(--card);
    border-radius: var(--radius-lg);
    padding: 20px;
    box-shadow: var(--shadow-soft);
    border: 1px solid var(--border);
    margin-bottom: 18px;
  }

  .form-group { margin-bottom: 12px; }
  .form-group label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--primary);
    margin-bottom: 5px;
  }

  .form-control {
    width: 100%;
    padding: 12px 14px;
    border-radius: 13px;
    border: 1px solid rgba(31, 54, 41, 0.16);
    background: #FAF9F6;
    font-size: 14.5px;
    color: var(--text-main);
    outline: none;
  }

  .form-control:focus {
    border-color: var(--primary);
    background: #fff;
  }

  .row-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .list-item {
    background: var(--card);
    border-radius: var(--radius-md);
    padding: 16px;
